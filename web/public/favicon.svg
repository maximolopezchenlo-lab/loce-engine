<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="loce-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="loce-wave" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="loce-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#090D16"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#loce-grad)" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Caption brackets [ ] -->
  <path d="M18 16 H14 V48 H18" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M46 16 H50 V48 H46" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central Microphone capsule & stand -->
  <rect x="26" y="18" width="12" height="18" rx="6" fill="#131B2E" stroke="url(#loce-grad)" stroke-width="2"/>
  <path d="M22 27 C22 34.5 42 34.5 42 27" stroke="url(#loce-grad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 35 V43 M26 43 H38" stroke="url(#loce-grad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Crossing Audio Waveform -->
  <path d="M11 32 C17 32 19 22 24 22 C29 22 31 40 36 40 C41 40 43 26 48 26 C51 26 53 32 55 32" stroke="url(#loce-wave)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#loce-glow)"/>
  
  <!-- Glowing signal point -->
  <circle cx="36" cy="40" r="2" fill="#38BDF8"/>
</svg>
