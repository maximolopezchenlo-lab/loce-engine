version: "3.8"

services:
  loce-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: loce-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-mock}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - REDIS_URL=${REDIS_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional local audio streamer simulator for dev / demo
  loce-mock-streamer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: loce-mock-streamer
    depends_on:
      loce-core:
        condition: service_healthy
    command: ["python", "scripts/mock_runner.py", "--host", "loce-core", "--rooms", "main-stage", "track-1", "--duration", "60"]
    restart: "no"
